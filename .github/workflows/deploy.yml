name: Deploy blog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]     # 可选：PR 时也构建一次，方便检查
  workflow_dispatch:     # 手动触发按钮（救急用）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 安装 Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      - name: 构建
        run: hugo --minify

      - name: 发布到 gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true        # gh-pages 只留最新一次提交，防止分支无限膨胀
